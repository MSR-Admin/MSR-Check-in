<!DOCTYPE html>
<html>
<head>
  <title>Test API Directly</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    .success { background: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin: 10px 0; }
    .error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 5px; margin: 10px 0; }
    .warning { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>Test API Directly</h1>
  
  <div class="warning">
    <strong>Instructions:</strong><br>
    1. Open this page in your browser<br>
    2. Check the console (F12) for the API response<br>
    3. If empty, the Google Apps Script deployment has an error
  </div>
  
  <h2>API Test Results:</h2>
  <div id="results"></div>
  
  <h2>Visitors Data:</h2>
  <pre id="visitorsData">Loading...</pre>
  
  <h2>Employees Data:</h2>
  <pre id="employeesData">Loading...</pre>
  
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbznvRVVrBk3cUdgub4WhW1oBsKX3ZisjxxPxqMVPB6mwtrqagn4y8I4sMzQAbApV6jPHA/exec';
    const resultsDiv = document.getElementById('results');
    
    async function testAPI() {
      try {
        // Test 1: Fetch visitors
        console.log('Fetching visitors from:', API_URL);
        const respVisitors = await fetch(API_URL);
        const textVisitors = await respVisitors.text();
        console.log('Visitors response status:', respVisitors.status);
        console.log('Visitors response text:', textVisitors);
        
        let jsonVisitors;
        try {
          jsonVisitors = JSON.parse(textVisitors);
        } catch (e) {
          jsonVisitors = { error: 'Invalid JSON', raw: textVisitors };
        }
        
        document.getElementById('visitorsData').textContent = JSON.stringify(jsonVisitors, null, 2);
        
        if (jsonVisitors.status === 'success' && jsonVisitors.data.length > 0) {
          resultsDiv.innerHTML += `<div class="success">✓ Visitors API working: ${jsonVisitors.data.length} records</div>`;
        } else {
          resultsDiv.innerHTML += `<div class="error">✗ Visitors API returned no data or error: ${JSON.stringify(jsonVisitors)}</div>`;
        }
        
        // Test 2: Fetch employees
        console.log('Fetching employees from:', API_URL + '?action=employees');
        const respEmployees = await fetch(API_URL + '?action=employees');
        const textEmployees = await respEmployees.text();
        console.log('Employees response status:', respEmployees.status);
        console.log('Employees response text:', textEmployees);
        
        let jsonEmployees;
        try {
          jsonEmployees = JSON.parse(textEmployees);
        } catch (e) {
          jsonEmployees = { error: 'Invalid JSON', raw: textEmployees };
        }
        
        document.getElementById('employeesData').textContent = JSON.stringify(jsonEmployees, null, 2);
        
        if (jsonEmployees.status === 'success' && jsonEmployees.data.length > 0) {
          resultsDiv.innerHTML += `<div class="success">✓ Employees API working: ${jsonEmployees.data.length} records</div>`;
        } else {
          resultsDiv.innerHTML += `<div class="error">✗ Employees API returned no data or error: ${JSON.stringify(jsonEmployees)}</div>`;
        }
        
      } catch (err) {
        resultsDiv.innerHTML += `<div class="error">✗ API Error: ${err.message}</div>`;
        console.error('API Error:', err);
      }
    }
    
    testAPI();
  </script>
</body>
</html>
