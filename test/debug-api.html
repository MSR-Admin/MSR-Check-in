<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Debug Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        .test-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .status {
            padding: 8px 15px;
            border-radius: 6px;
            font-weight: 600;
            display: inline-block;
            margin: 10px 0;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.pending {
            background: #fff3cd;
            color: #856404;
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        button.secondary {
            background: #2196F3;
        }
        button.secondary:hover {
            background: #1976D2;
        }
        .log {
            background: #f8f9fa;
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 13px;
        }
        .warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API Debug Test</h1>
        
        <div class="section">
            <h2>📊 API Status Test</h2>
            <div class="test-box">
                <div id="status1" class="status pending">Waiting for test...</div>
                <pre id="result1">Click "Test API" to check response...</pre>
                <div id="headers1" style="display:none;">
                    <strong>Response Headers:</strong>
                    <pre id="headers1content"></pre>
                </div>
            </div>
            <button onclick="testAPI()">Test API</button>
            <button class="secondary" onclick="clearLogs()">Clear Logs</button>
        </div>
        
        <div class="section">
            <h2>📝 Debug Logs</h2>
            <div id="logs" class="log">Ready to test...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbznvRVVrBk3cUdgub4WhW1oBsKX3ZisjxxPxqMVPB6mwtrqagn4y8I4sMzQAbApV6jPHA/exec?action=dashboard';
        
        function log(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}<br>` + logs.innerHTML;
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = 'Logs cleared...';
        }
        
        async function testAPI() {
            const statusEl = document.getElementById('status1');
            const resultEl = document.getElementById('result1');
            const headersEl = document.getElementById('headers1');
            const headersContentEl = document.getElementById('headers1content');
            
            statusEl.className = 'status pending';
            statusEl.textContent = 'Testing...';
            resultEl.textContent = 'Waiting for response...';
            headersEl.style.display = 'none';
            
            log('Starting API test...');
            
            try {
                const startTime = Date.now();
                
                const response = await fetch(API_URL, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                const endTime = Date.now();
                const duration = endTime - startTime;
                
                log(`Response received in ${duration}ms with status ${response.status}`);
                
                if (response.ok) {
                    const contentType = response.headers.get('content-type');
                    log(`Content-Type: ${contentType}`);
                    
                    const text = await response.text();
                    log(`Response length: ${text.length} characters`);
                    
                    statusEl.className = 'status success';
                    statusEl.textContent = '✓ Success';
                    resultEl.textContent = text.substring(0, 500) + (text.length > 500 ? '...' : '');
                    
                    if (contentType && contentType.includes('application/json')) {
                        try {
                            const json = JSON.parse(text);
                            resultEl.textContent = JSON.stringify(json, null, 2).substring(0, 500) + '...';
                            log('✓ Valid JSON response');
                        } catch (e) {
                            resultEl.textContent = text.substring(0, 500);
                            log('✗ Response is not valid JSON');
                        }
                    }
                } else {
                    statusEl.className = 'status error';
                    statusEl.textContent = `✗ Error ${response.status}`;
                    resultEl.textContent = `HTTP ${response.status}: ${response.statusText}`;
                    log(`✗ HTTP Error: ${response.status} ${response.statusText}`);
                    
                    if (response.status === 302) {
                        const location = response.headers.get('location');
                        log(`Redirect location: ${location}`);
                        resultEl.textContent += `\n\nRedirect Location: ${location}`;
                    }
                }
                
            } catch (error) {
                log(`✗ Network error: ${error.message}`);
                statusEl.className = 'status error';
                statusEl.textContent = '✗ Network Error';
                resultEl.textContent = `Error: ${error.message}`;
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            log('Page loaded. Ready to test.');
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
