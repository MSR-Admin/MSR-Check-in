<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Field Mapping Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .log {
            background: #f8f9fa;
            border-left: 4px solid #2196F3;
            padding: 10px 15px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 API Field Mapping Test</h1>
        
        <div class="section">
            <h2>📊 Test Results</h2>
            <div id="logs" class="log">Click "Test API" to check field mappings...</div>
            <button onclick="testAPI()">Test API</button>
        </div>
        
        <div class="section">
            <h2>📋 Expected vs Actual Fields</h2>
            <pre id="comparison">Waiting for test...</pre>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbznvRVVrBk3cUdgub4WhW1oBsKX3ZisjxxPxqMVPB6mwtrqagn4y8I4sMzQAbApV6jPHA/exec';
        
        function log(message) {
            const logs = document.getElementById('logs');
            logs.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}<br>` + logs.innerHTML;
        }
        
        async function testAPI() {
            const comparisonEl = document.getElementById('comparison');
            
            log('Testing API field mappings...');
            
            try {
                const response = await fetch(API_URL + '?action=logs');
                const data = await response.json();
                
                log(`Response received: ${JSON.stringify(data).substring(0, 200)}...`);
                
                if (data.success && data.data && data.data.length > 0) {
                    const firstLog = data.data[0];
                    const fields = Object.keys(firstLog);
                    
                    log(`Fields found: ${fields.join(', ')}`);
                    
                    // Show expected vs actual
                    let comparison = 'EXPECTED FIELD MAPPING:\n\n';
                    comparison += 'API Response Field → Sheet Column:\n';
                    comparison += '─────────────────────────────────────\n';
                    comparison += 'id → Column A (ID)\n';
                    comparison += 'date → Column B (Date)\n';
                    comparison += 'time → Column C (Time)\n';
                    comparison += 'fullName → Column D (Full Name)\n';
                    comparison += 'idNumber → Column E (ID Number)\n';
                    comparison += 'contactNumber → Column F (Contact Number)\n';
                    comparison += 'contactPerson → Column G (Contact Person)\n';
                    comparison += 'purpose → Column H (Purpose)\n';
                    comparison += 'status → Column I (Status)\n';
                    comparison += 'checkoutTime → Column J (Checkout Time)\n\n';
                    
                    comparison += 'ACTUAL API RESPONSE (First Entry):\n';
                    comparison += '─────────────────────────────────────\n';
                    comparison += JSON.stringify(firstLog, null, 2);
                    
                    comparisonEl.textContent = comparison;
                    log('✓ Field mapping test complete');
                } else {
                    comparisonEl.textContent = 'No data returned from API';
                    log('✗ No data in response');
                }
                
            } catch (error) {
                comparisonEl.textContent = `Error: ${error.message}`;
                log(`✗ Error: ${error.message}`);
            }
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            log('Page loaded. Ready to test.');
            setTimeout(testAPI, 500);
        });
    </script>
</body>
</html>
