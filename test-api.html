<!DOCTYPE html>
<html>
<head>
  <title>Test API Sync</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .result { padding: 10px; margin: 5px 0; border-radius: 5px; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
    pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>Test API Sync</h1>
  <p>This tests if the Google Apps Script API is returning data correctly.</p>
  
  <div id="results"></div>
  
  <h2>Visitors Data</h2>
  <pre id="visitorsData">Loading...</pre>
  
  <h2>Employees Data</h2>
  <pre id="employeesData">Loading...</pre>
  
  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwcG57xAYjgoiA0YEwowIElQZv9Obr4hqr5fnH1cnJmlxHrHejbfYl43YJ8cnHUcC-JHw/exec';
    
    async function testAPI() {
      const resultsDiv = document.getElementById('results');
      
      try {
        // Test 1: Fetch visitors
        const respVisitors = await fetch(API_URL);
        const jsonVisitors = await respVisitors.json();
        document.getElementById('visitorsData').textContent = JSON.stringify(jsonVisitors, null, 2);
        
        if (jsonVisitors.status === 'success' && jsonVisitors.data.length > 0) {
          resultsDiv.innerHTML += `<div class="result success">✓ Visitors API working: ${jsonVisitors.data.length} records</div>`;
        } else {
          resultsDiv.innerHTML += `<div class="result error">✗ Visitors API returned no data or error</div>`;
        }
        
        // Test 2: Fetch employees
        const respEmployees = await fetch(API_URL + '?action=employees');
        const jsonEmployees = await respEmployees.json();
        document.getElementById('employeesData').textContent = JSON.stringify(jsonEmployees, null, 2);
        
        if (jsonEmployees.status === 'success' && jsonEmployees.data.length > 0) {
          resultsDiv.innerHTML += `<div class="result success">✓ Employees API working: ${jsonEmployees.data.length} records</div>`;
        } else {
          resultsDiv.innerHTML += `<div class="result error">✗ Employees API returned no data or error</div>`;
        }
        
      } catch (err) {
        resultsDiv.innerHTML += `<div class="result error">✗ API Error: ${err.message}</div>`;
        console.error('API Error:', err);
      }
    }
    
    testAPI();
  </script>
</body>
</html>
